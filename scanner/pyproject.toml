[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketboard"
version = "0.1.0"
description = "Private US-market swing board scanner (read-only market data, paper keys only)"
requires-python = ">=3.12"
dependencies = [
  "alpaca-py>=0.44",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["marketboard*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["marketboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# alpaca-py imports the deprecated websockets.legacy API; not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
